# Keeps Octop's slash commands in the Discord "/" menu.
#   ExecStartPre  - re-applies the adapter patch if an octop update replaced it
#   ExecStartPost - (re)registers the command list with the Discord API
# Both are best-effort: a failure must not take the service down.
[Service]
ExecStartPre=-/home/hongbin/.octop/venv/bin/python /media/intel1TB1/octop-patches/install_adapter_patch.py
ExecStartPost=-/home/hongbin/.octop/venv/bin/python /media/intel1TB1/octop-patches/register_discord_commands.py
